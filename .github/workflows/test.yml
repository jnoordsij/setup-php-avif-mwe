name: tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test_26-04:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    name: Test Ubuntu 26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
            php-version: 8.5
            extensions: imagick

      - name: Test
        run: php test.php

  test_26-04_patched:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    name: Test Ubuntu 26.04 (patched)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
            php-version: 8.5
            extensions: imagick

      - name: Install dependencies
        shell: bash
        run: |
            sudo apt update
            sudo apt install libheif-plugin-aomenc -y

      - name: Test
        run: php test.php

  test_24-04:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    name: Test Ubuntu 24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
            php-version: 8.5
            extensions: imagick

      - name: Test
        run: php test.php
